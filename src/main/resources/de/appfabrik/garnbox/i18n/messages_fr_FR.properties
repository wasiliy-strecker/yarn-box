export.failed=La collection n’a pas pu être exportée. Vérifiez le dossier de destination, l’espace libre et les photos enregistrées, puis réessayez.
privacy.export=Exportation de la collection\nVous pouvez exporter toutes les entrées enregistrées, les valeurs de couleur choisies et les photos dans un fichier JSON à l’emplacement de votre choix. Les copies enregistrées des photos sont incluses intégralement, avec les métadonnées qu’elles contiennent encore. Le fichier n’est pas chiffré. L’application ne le téléverse ni ne l’envoie. Si vous l’enregistrez dans un dossier cloud ou réseau, son fournisseur peut le traiter. Le partage et la suppression des copies exportées relèvent de votre responsabilité.

photo.directoryNotSaved=Photo chargée. Le dossier n’a pu être mémorisé que pour cette session. Vérifiez les droits d’écriture du dossier de données de l’application.
privacy.photoDirectory=Dossier de sélection des photos\nL’application mémorise localement le dossier de la dernière photo choisie pour y ouvrir la prochaine sélection, même après un redémarrage. Seul le chemin du dossier est enregistré dans les données de l’application. Il n’est ni inclus dans les exportations ni transmis.

