export.title=Esporta la collezione di filati
export.busy=Esportazione della collezione con foto …
export.saved={0,number,integer} voci esportate in {1}
export.exists=Questo file esiste già. Scegli un nuovo nome per l’esportazione.
export.failed=Impossibile esportare la collezione. Controlla la cartella di destinazione, lo spazio libero e le foto salvate, quindi riprova.
privacy.export=Esportazione della collezione\nPuoi esportare tutte le voci salvate, i valori dei colori scelti e le foto in un file JSON nella posizione che preferisci. Le copie salvate delle foto sono incluse integralmente, con gli eventuali metadati ancora presenti. Il file non è crittografato. L’app non lo carica né lo invia. Se lo salvi in una cartella cloud o di rete, il relativo fornitore può elaborarlo. La condivisione e l’eliminazione delle copie esportate sono di tua responsabilità.

photo.directoryNotSaved=Foto caricata. La cartella è stata memorizzata solo per questa sessione. Controlla i permessi di scrittura della cartella dei dati dell’app.
privacy.photoDirectory=Cartella di selezione delle foto\nL’app ricorda localmente la cartella dell’ultima foto selezionata per aprire lì la selezione successiva, anche dopo un riavvio. Viene salvato solo il percorso della cartella nei dati dell’app. Non viene incluso nelle esportazioni né trasmesso.

# Collection import
action.import=Importa
import.title=Importa la collezione di filati
import.busy=Verifica e importazione della collezione …
import.saved=Importate: {0,number,integer}. Già presenti: {1,number,integer}.
import.failed=Impossibile completare l’importazione. La collezione non è cambiata. Riprova.
import.error.READ=Impossibile leggere il file. Controlla il file e i permessi di accesso.
import.error.FORMAT=Questo file non è un’esportazione valida di Yarn Box. La collezione non è cambiata.
import.error.VERSION=Questa versione di esportazione non è supportata. La collezione non è cambiata.
import.error.LIMIT=L’importazione supera un limite: 256 MiB per file, 10.000 voci, 1.048.576 caratteri per campo di testo o 10 MiB per foto.
import.error.PHOTO=Una foto nell’esportazione non è valida o è troppo grande. La collezione non è cambiata.
privacy.import=Importazione della collezione\nL’app legge l’esportazione JSON scelta e aggiunge le voci, i colori e le foto alla collezione locale. Le voci esistenti vengono conservate e le copie identiche già presenti vengono ignorate. Il file originale non viene modificato né trasmesso. Le foto importate conservano i metadati inclusi nell’esportazione.
photoError.OPTIMIZE=Impossibile ottimizzare la foto. Scegli un altro JPEG o PNG. La foto attuale viene conservata.
privacy.photoOptimization=Ottimizzazione delle nuove foto\nLe foto appena scelte o sostituite vengono salvate come copie con un lato massimo di 1600 pixel, mantenendo le proporzioni. Le immagini più piccole non vengono ingrandite. Le immagini opache vengono salvate come JPEG con qualità dell’85 %, quelle trasparenti come PNG. L’orientamento EXIF viene applicato ai pixel. I metadati del file originale, come fotocamera e posizione, non vengono copiati. Il file originale, le foto già salvate e quelle ripristinate da JSON rimangono invariati.

limit.ENTRIES=La raccolta può contenere al massimo 10.000 voci. Elimina una voce prima di aggiungerne altre. Nessuna modifica è stata salvata.
limit.TEXT=Un campo supera 1.048.576 caratteri. Accorcialo prima di salvare o esportare. Non sono state salvate modifiche né creata un’esportazione.
limit.FILE_SIZE=L’esportazione supera 256 MiB. Nessun file è stato creato. Chiudi l’app e copia garnbox.db per salvare l’intera raccolta.

