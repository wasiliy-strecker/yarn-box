info.title=Info
privacy.title=Informativa sulla privacy di Yarn Box
privacy.date=Aggiornata il 31 ottobre 2026
privacy.body=Titolare e contatti\nWasiliy Strecker · AppFabrik AI\nLudwigstrasse 23, 86152 Augusta, Germania\nPrivacy: contact@appfabrik-ai.de\nAssistenza: support@appfabrik-ai.de\n\nFinalità e dati salvati\nYarn Box gestisce la tua collezione di filati. Memorizza nome, marca, colore, posizione, note e una foto facoltativa per filato. Questi dati, gli identificativi interni e la preferenza di lingua vengono salvati per impostazione predefinita localmente nel profilo utente del computer. Testi e foto possono contenere informazioni personali. Il trattamento serve alle funzioni di gestione e ricerca richieste.\n\nTrattamento locale\nL’app non richiede un account né un server. Non invia i tuoi dati o la preferenza di lingua allo sviluppatore o ad altri destinatari. Non contiene pubblicità, telemetria, analisi dell’utilizzo o sincronizzazione cloud propria. Questa informativa è inclusa nell’app e funziona offline. L’app non cifra autonomamente i dati locali. La protezione dipende anche dall’account utente, dai permessi di accesso e dall’eventuale cifratura del disco.\n\nFoto e copie di sicurezza\nL’app legge solo l’immagine JPEG o PNG selezionata e ne salva una copia nel database locale. Non modifica né elimina il file originale. I metadati esistenti dell’immagine possono rimanere nella copia salvata. Se esegui il backup della cartella dei dati o la salvi in una cartella sincronizzata o su un’unità di rete, tali servizi possono trattare dati al di fuori dell’app. Si applicano le loro impostazioni e informative sulla privacy. L’app non controlla questi servizi.\n\nConservazione ed eliminazione\nI dati rimangono salvati finché elimini le voci o rimuovi i dati locali dell’app. Puoi visualizzare, modificare ed eliminare le voci nell’app. Per rimuovere tutti i dati locali, comprese le foto e la preferenza di lingua, chiudi l’app ed elimina la cartella dei dati. Le posizioni sono descritte nelle istruzioni incluse. Le foto originali e i backup devono essere eliminati separatamente. Eliminare una voce non garantisce la cancellazione sicura dei contenuti precedenti. Non presumere che la disinstallazione elimini tutti i dati e le copie esterne.\n\nContatto e assistenza\nSe ci invii volontariamente un’e-mail, trattiamo il tuo indirizzo e-mail, il messaggio e gli allegati per rispondere alla richiesta. La raccolta locale non viene allegata automaticamente. La base giuridica per le richieste relative a un contratto è l’articolo 6, paragrafo 1, lettera b del GDPR. Per le altre richieste è il nostro legittimo interesse a rispondere, ai sensi dell’articolo 6, paragrafo 1, lettera f del GDPR. Conserviamo la corrispondenza solo per il tempo necessario a gestire la richiesta e adempiere agli obblighi legali di conservazione.\n\nI tuoi diritti e altri fornitori\nOve applicabili, hai diritto di accesso, rettifica, cancellazione, limitazione del trattamento, portabilità e opposizione, oltre al diritto di presentare un reclamo a un’autorità di protezione dei dati. Puoi utilizzare il contatto privacy riportato sopra. Lo sviluppatore non può accedere alle raccolte presenti soltanto sul tuo computer. Quando ottieni o aggiorni l’app tramite Apple App Store, Microsoft Store o GitHub, questi fornitori possono trattare dati autonomamente secondo le proprie condizioni. Questa informativa descrive il trattamento di Yarn Box e sarà aggiornata se tale trattamento cambia.

